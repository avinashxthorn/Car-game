name: Build Saini Drive APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify gameplay physics
        run: node --test tests/physics.test.mjs
      - name: Build and lint Android APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Saini-Drive.apk
          sha256sum dist/Saini-Drive.apk > dist/Saini-Drive.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Saini-Drive-APK
          path: dist/*
          retention-days: 30
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/Saini-Drive.apk dist/Saini-Drive.apk.sha256 --title "Saini Drive · Build ${{ github.run_number }}" --notes-file RELEASE_NOTES.md --target "${{ github.sha }}"
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Saini-Drive-APK
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: false
          script: bash tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-screenshots
          path: smoke-output/
